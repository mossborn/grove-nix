# ~/nixos/dotfiles/noctalia/config.toml  (linked to ~/.config/noctalia)
# Minimal, clean setup: full-width flush bar, no dock, Windir custom palette.
# GUI changes land in ~/.local/state/noctalia/settings.toml, which overrides this file.

[shell]
corner_radius_scale = 1.0      # matches hyprland.lua's window rounding = 20
font_family = "Inter"          # already installed via desktop.nix fonts.packages
polkit_agent = true            # Noctalia handles password prompts (sudo GUIs, mounts)
settings_show_advanced = false # keep the Settings UI itself uncluttered

[shell.panel]
transparency_mode = "soft"          # semi-translucent so Hyprland's blur (see layer_rule) shows through
borders = false                     # no outline; blur + shadow carry the separation
shadow = true
launcher_placement = "floating"     # matches Super+Space opening centered
clipboard_placement = "floating"    # matches Super+V
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[shell.launcher]
show_app_origin_indicator = false
sort_by_usage = true

# ── Wallpaper ─────────────────────────────────────────────────────────────────
[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade"]     # one clean transition instead of the full random set
transition_duration = 900

# ── Theme ─────────────────────────────────────────────────────────────────────
[theme]
mode = "dark"
source = "custom"
custom_palette = "Windir"   # loads dotfiles/noctalia/palettes/Windir.json

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["kitty", "gtk3", "gtk4"]   # kitty (used in hyprland.lua) + GTK apps (Nautilus, etc.)

# ── Notifications ─────────────────────────────────────────────────────────────
[notification]
background_opacity = 0.92
layer = "top"

# ── OSD ───────────────────────────────────────────────────────────────────────
[osd]
position = "top_right"
background_opacity = 0.92

# ── Lock Screen ───────────────────────────────────────────────────────────────
[lockscreen]
enabled = true
blurred_desktop = true      # uses wlr-screencopy; frosted desktop instead of a flat overlay
blur_intensity = 0.6

# ── Bar: full-width, flush to the edges, no floating pill ────────────────────
[bar.main]
position = "top"
thickness = 32
background_opacity = 0.95
radius = 0                 # flush corners, no pill/capsule shape
margin_ends = 0
margin_edge = 0
padding = 10
widget_spacing = 8
shadow = false              # flat and flush; no bar-level shadow
auto_hide = false
reserve_space = true
capsule = false              # no per-widget pill backgrounds; spacing alone separates widgets

start = ["launcher", "workspaces"]
center = ["clock"]
end = ["media", "tray", "network", "volume", "control-center", "session"]

# ── Dock: off ─────────────────────────────────────────────────────────────────
[dock]
enabled = false
